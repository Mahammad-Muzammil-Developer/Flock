services:
  - type: web
    name: flock-energy-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: URJA_USERNAME
        sync: false
      - key: URJA_PASSWORD
        sync: false
      - key: URJA_BASE_URL
        value: https://urja-ops.flockenergy.tech
